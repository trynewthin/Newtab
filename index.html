<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/newtab.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <title>PTab</title>
</head>

<body>
  <script>
    // Anti-FOUC: apply theme before React loads to prevent white flash
    (function() {
      try {
        var raw = localStorage.getItem('app-settings');
        var theme = raw ? JSON.parse(raw).state.theme : 'light';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(isDark ? 'dark' : 'light');
        document.body.style.backgroundColor = isDark ? '#0d0d14' : '#f5f5f7';
      } catch(e) {
        document.documentElement.classList.add('light');
        document.body.style.backgroundColor = '#f5f5f7';
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/surfaces/newtab/main.tsx"></script>
</body>

</html>
